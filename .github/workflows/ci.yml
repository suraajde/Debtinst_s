name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-zero-dependency:
    name: Zero-Dependency Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero external packages installed
        shell: bash
        run: |
          echo "Verifying clean standard library environment..."
          pip list

      - name: Run embedded database verification
        run: |
          python src/embedded_seed.py

      - name: Run market data engine verification
        run: |
          python src/data_engine.py

      - name: Run quantitative engine verification
        run: |
          python src/quant_engine.py

      - name: Run unit tests
        run: |
          python -m unittest discover tests -v
